name: Send Reminders

on:
  schedule:
    - cron: '*/15 * * * *'   # Every 15 minutes (within GitHub Actions free budget; the cron route's 30-90 min catch window absorbs any missed ticks)
  workflow_dispatch:           # Manual trigger

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder cron
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          : "${APP_URL:?APP_URL secret is not set}"
          : "${CRON_SECRET:?CRON_SECRET secret is not set}"
          curl -sf -X GET \
            "$APP_URL/api/cron/reminders" \
            -H "x-cron-secret: $CRON_SECRET" \
            -o /dev/null \
            -w "Status: %{http_code}\n"
