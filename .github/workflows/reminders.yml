name: Send Reminders

on:
  schedule:
    - cron: '0,30 * * * *'   # Every 30 minutes
  workflow_dispatch:           # Manual trigger

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder cron
        run: |
          curl -sf -X GET \
            "${{ secrets.APP_URL }}/api/cron/reminders" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -o /dev/null \
            -w "Status: %{http_code}\n"
